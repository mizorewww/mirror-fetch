[package]
name = "mirror-fetch"
version = "0.1.0"
edition = "2024"
# File::try_lock, for one download per destination.
rust-version = "1.89"
license = "MIT"
description = "Resumable, verified downloads from ordered mirrors, with a Hugging Face layer and a CLI"
repository = "https://github.com/mizorewww/mirror-fetch"
homepage = "https://github.com/mizorewww/mirror-fetch"
documentation = "https://docs.rs/mirror-fetch"
readme = "README.md"
keywords = ["download", "resume", "mirror", "huggingface", "aria2"]
categories = ["network-programming", "command-line-utilities"]
# Consumed as a git dependency; see README.
publish = false

[features]
# `lookup_country`: asks public services for this machine's country. Off by default,
# and nothing calls it on its own.
ip-lookup = []
# The `mirror-fetch` program. Its dependencies are optional, so the library alone
# never pulls them in.
cli = ["dep:clap", "dep:ctrlc"]

[dependencies]
clap = { version = "4", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
ctrlc = { version = "3", optional = true }
getrandom = "0.4"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
ureq = "3"
url = "2"

[[bin]]
name = "mirror-fetch"
path = "src/bin/mirror-fetch/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
