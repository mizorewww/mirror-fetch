[package]
name = "model-fetch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Resumable, verified downloads of model files from Hugging Face and its mirrors"
repository = "https://github.com/mizorewww/model-fetch"
readme = "README.md"
keywords = ["huggingface", "download", "resume", "aria2", "models"]
categories = ["network-programming"]
# Consumed as a git dependency; see README.
publish = false

[features]
# `lookup_country`: asks public services for this machine's country. Off by default,
# and nothing calls it on its own.
ip-lookup = []

[dependencies]
getrandom = "0.4"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = "3"
url = "2"

[package.metadata.docs.rs]
all-features = true
