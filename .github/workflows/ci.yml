name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # bash on every runner: Windows' default pwsh does not stop multi-line
    # steps at the first failing native command.
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, default features
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, CLI
        run: cargo clippy --all-targets --features cli -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build, CLI
        run: cargo build --features cli
      - name: Library stays free of CLI dependencies
        run: |
          # Every library feature, every platform; only `cli` may bring these in.
          tree=$(cargo tree --edges normal --prefix none --target all --features ip-lookup)
          if grep -E '^(clap|clap_builder|clap_derive|ctrlc) ' <<<"$tree"; then
            echo "the library depends on a CLI-only crate" >&2
            exit 1
          fi
      - name: Test, default features
        run: cargo test
      - name: Test, CLI
        run: cargo test --features cli
      - name: Test, all features
        run: cargo test --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
